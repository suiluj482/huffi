name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cargo-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libgl-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev
      - run: cargo test --workspace --all-features

  cargo-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libgl-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev
      - run: cargo build --workspace --all-features --release
      - uses: actions/upload-artifact@v4
        with:
          name: huffi-cargo-${{ github.sha }}
          path: |
            target/release/huffi
            target/release/huffi-cli
            target/release/huffi-ui
          retention-days: 14

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libgl-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  nix-flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - run: nix flake check --print-build-logs

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    needs: nix-flake-check
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - uses: cachix/cachix-action@v14
        with:
          name: suiluj482
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .# --print-build-logs
