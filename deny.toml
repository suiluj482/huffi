[licenses]
version = 2
confidence-threshold = 0.8

# Only licenses confirmed compatible with combining into a GPL-3.0 binary.
# Anything not listed here fails `cargo deny check licenses` — check it
# by hand before adding it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]

# Per-crate overrides for cases where a crate's declared license doesn't
# cleanly parse, or you've manually verified an exception is fine.
exceptions = [
    # { allow = ["OpenSSL"], crate = "ring" },
]

# [[licenses.clarify]]
# Example: some crates ship a LICENSE file that doesn't match their
# Cargo.toml `license` field cleanly; cargo-deny lets you pin the
# expression + a hash of the license file to confirm it manually once.
# name = "ring"
# expression = "MIT AND ISC AND OpenSSL"
# license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
