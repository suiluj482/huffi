[package]
name = "huffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Scoring engine and history store for the huffi adaptive application launcher"
repository = "https://github.com/suiluj482/huffi"

[[bin]]
name = "huffi-daemon"
path = "src/main.rs"

[dependencies]
huffi-protocol = { path = "../huffi-protocol" }
nucleo = "0.5"
freedesktop-desktop-entry = "0.5"
freedesktop-icons = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rink-core = { version = "0.8", features = ["bundle-files"] }
