[package]
name = "huffi-ui-gtk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "GTK4 GUI for the huffi adaptive application launcher"
repository = "https://github.com/suiluj482/huffi"

[[bin]]
name = "huffi-ui-gtk"
path = "src/main.rs"

[dependencies]
huffi-protocol = { path = "../huffi-protocol" }
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
async-channel = "2"
dirs = "6"
